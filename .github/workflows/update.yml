name: Update FII DII Data

on:
  schedule:
    - cron: '0 11 * * 1-5'   # 4:30 PM IST every weekday
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5 # Upgraded from v4

      - name: Setup Node.js
        uses: actions/setup-node@v5 # Upgraded from v4
        with:
          node-version: '24' # Upgraded to target Node 24 directly

      - name: Run fetcher
        run: node fetch.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ fii_dii.pine
          git diff --cached --quiet || git commit -m "Auto-update FII/DII $(date +'%Y-%m-%d')"
          git push
